<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=initial-scale=1.0" />
  <title>Cards</title>
</head>
<body>
  <div id="widget-container">
    <form id="card-validator-form">
      <ul class="cards-list">
        <li class="card-icon visa" title="Visa"></li>
        <li class="card-icon mastercard" title="Mastercard"></li>
        <li class="card-icon amex" title="American Express"></li>
        <li class="card-icon discover" title="Discover"></li>
        <li class="card-icon jcb" title="JCB"></li>
        <li class="card-icon diners" title="Diners Club"></li>
        <li class="card-icon mir" title="Мир"></li>
      </ul>
      <div class="input-container">
        <input type="text" id="card-number-input" placeholder="Введите номер карты" />
        <button type="submit" id="submit-btn">Click to Validate</button>
      </div>
    </form>
  </div>
</body>
</html>
